<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#101e3d" />
    <title>Dungeon Crawler Carl · Floor One</title>
    <link rel="stylesheet" href="game.css" />
  </head>
  <body>
    <main id="game">
      <header class="window topbar">
        <div>
          <span class="eyebrow">DUNGEON CRAWLER CARL</span
          ><strong id="area">Floor 1 · The tutorial</strong>
        </div>
        <span id="quest">Find Mordecai</span
        ><button id="menu-button">Menu <kbd>Esc</kbd></button>
      </header>
      <section id="stage" aria-label="Dungeon map">
        <canvas
          id="world"
          tabindex="0"
          aria-label="Dungeon. Move with arrow keys or WASD. E to interact."
        ></canvas>
        <div id="loading" class="window loading">
          Entering the dungeon…<small>Preparing the C# game engine</small>
        </div>
        <div id="toast" class="window toast" role="status"></div>
        <div id="battle-banner"></div>
        <div id="controls">
          <div class="dpad">
            <button data-dir="up" aria-label="Move north">▲</button
            ><button data-dir="left" aria-label="Move west">◀</button
            ><button data-dir="down" aria-label="Move south">▼</button
            ><button data-dir="right" aria-label="Move east">▶</button>
          </div>
          <button id="interact">Interact <kbd>E</kbd></button>
        </div>
      </section>
      <footer id="deck" class="window"></footer>
      <div id="modal-root"></div>
    </main>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script type="module" src="game.js"></script>
  </body>
</html>
