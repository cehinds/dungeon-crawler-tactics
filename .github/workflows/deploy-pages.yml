name: Deploy Floor One to GitHub Pages
on:
  push:
    branches: [main]
    tags: ['pages-dev-*']
  workflow_dispatch:
permissions: {}
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test deterministic game rules
        run: dotnet run --project Rebuild/Tests -c Release
      - name: Publish .NET browser host
        run: dotnet publish Web/DungeonCrawlerTactics.Web.csproj -c Release -o Web/publish
      - name: Restore verified playable art subset
        run: python3 Tools/prepare_hosted_assets.py Web/publish/wwwroot --remote
      - name: Check static entry points
        run: |
          test -f Web/publish/wwwroot/index.html
          test -f Web/publish/wwwroot/_framework/blazor.webassembly.js
          test -f Web/publish/wwwroot/data/floor-one-rpg.json
          touch Web/publish/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: Web/publish/wwwroot
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified build
        id: deployment
        uses: actions/deploy-pages@v4
